<a href="products.html?category=<?kit.category_id?>" class="button" >Return to Product Page</a>
<br/>

<p/>

<form method="POST" action="kit_select.html" enctype="multipart/form-data">
<input type="hidden" name="kit_id" id="kit_id" />
<fieldset style="width: 100%">
  <legend>Kit Contents</legend>
  <table>
    <tr>
    <th>Product</th>
		<th>Qty</th>
		<th>Category</th>
		<th>Id</th>
		<th>Name</th>

     
    </tr>
    <?loop kit_contents?>
			<tr>
			<td> 
			<a href="kit_select.html?category=<?category?>;kit_id=<?kit_id?>">
			<?id?>  
			</a>
			</td>
			<td> <?qty?> </td>
			<td><?cat_name?> </td>
			<td><?strid?> </td>
			<td> <?name?></td>
        
			</a>
			</tr>
    <?endloop kit_contents?>

  </table>
</fieldset>

<fieldset style="width: 100%">
  <legend>Modify Contents</legend>

  <table class="no-border" >
	<tr>
		<td>Search Category:</td> 
		<td colspan="3"> <select name="category" id="category"> <?categories?> </select> </td>
		<td rowspan="2"><button type="submit" name="Search" value="Search" >Search</button>
	</tr>
	<tr>
		<td >
			<input type="checkbox" name="show_all" value="1" id="show_all"> Show InActive
		</td>
	</tr>
  </table>

<?if products?>
<button type="submit" class="button" value="Save Changes" name="Save" style="float:left"/>Save Changes</button><br />

    <tr>
    <th>Add Product</th>
		<th>Qty</th>
		<th>Id</th>
		<th>Name</th>

     
    </tr>
    <?loop products?>
			<tr>
			<td><input type="checkbox" name="contents" id="id-<?id?>" value="<?id?>"> <?id?> </td>
			<td><input name="qty-<?id?>" id="qty-<?id?>" size="5" value=""></td>
			<td><?strid?> </td>
			<td> <?name?></td>
			</tr>
    <?endloop products?>

  </table>
  <br />

<button type="submit" class="button" value="Save Changes" name="Save" style="float:left"/>Save Changes</button><br />
<?endif products?>
<br />
