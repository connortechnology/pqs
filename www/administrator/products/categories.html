<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	<title>
		<!--#include virtual="/includes/web_page_title.html" -->
		Reports - Orders
	</title>
	
	<!--#include virtual="/includes/web_page_meta.html" -->
	<!--#include virtual="/includes/h1-admin-css.html" -->
	
	<link href="/styles/forms.css" rel="stylesheet" media="screen" />

	<!--#include virtual="/includes/h2-js.html" -->

	<script type="text/javascript" src="/javascripts/other.js"></script>
    
    <style>
	th { border-color:#FFFFFF;
	}
	
	th, tr, td {
		padding:3px 3px 3px 3px !important;
	}
	</style>
</head>

<body>

<!--#include virtual="/includes/c1-admin-nav.html" -->

<div id="sidebar">
		<div class="option">
		</div>
</div>
<div id="content" style="width="1000px">
	<h1><span class="title-section">Category </span></h1>



<form method="POST" action="categories.html" enctype="multipart/form-data" autocomplete="off">

<input type="submit" class="button" value="Save Page" name="Save" style="float:left"/><br />
<br />

<fieldset>
	<legend>Categories</legend>
    <?loop categories?>
		<? eval( $variable->{left} = $variable->{level} * 10) ?> 
		<div style="margin-top: 50px">
		<div style="margin-left: <?left?>px;">

		<label><?id?> &nbsp;<strong><?name?></strong></label>
		<button type="submit" name="Delete" value="<?id?>" onClick="return confirm('Are you sure you want to delete this Category?')" >Delete</button>
		<br/>
        <label>Active:</label> <input type="checkbox" name="active-<?id?>" value="1" <?if active?> checked <?endif active?> /> <?active?>
		<br/>
		
				
			<br/>

			<label>Parent:</label>
			<select name="parent-<?id?>" id="parent-<?id?>" width=5">
					<option value="">None</option>
					<?parents?>
			</select>
			<br/>

            <label>Name:</label> <input type="text" name="editname-<?id?>" value="<?name?>" /> 
			<br />
			<label>Description:</label> <textarea name="description-<?id?>"  /> <?description?></textarea> <br />
			<label>Header:</label> <textarea name="header-<?id?>"  /> <?header?></textarea> <br />
			<label>Footer:</label> <textarea name="footer-<?id?>"  /> <?footer?></textarea> <br />
		</div>
		</div>
		<br/>
    <?endloop categories?>
		<div style="margin-left: 10px; margin-top:50px">
			<label><strong>Add New Category</strong></label>
			<br/>
			<label>Parent</label>
			<select name="parent-new" id="parent-new" width=5>
					<option value="">None</option>
					<?parents?>
			</select>
			<br/>
			<label>Name</label>
            <input type="text" name="editname-new" value="" /> <br/>
			<label>Description:</label> <textarea name="description-new"  /> </textarea> <br />
			<button type="submit" class="button" value="Save Page" name="Save" style="float:left"/>Add New</button>
			<br />
		</div>
		<br/>
</fieldset>

  </form>
 </div>

<div  style="float:bottom">
<!--#include virtual="/includes/administrator/admin-footer.html" -->
</div>
</body>
</html>
