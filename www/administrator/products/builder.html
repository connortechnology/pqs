<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	<title>
		<!--#include virtual="/includes/web_page_title.html" -->
		Reports - Orders
	</title>
	
	<!--#include virtual="/includes/web_page_meta.html" -->
	<!--#include virtual="/includes/h1-admin-css.html" -->
	
	<link href="/styles/forms.css" rel="stylesheet" media="screen" />

	<!--#include virtual="/includes/h2-js.html" -->

	<script type="text/javascript" src="/javascripts/other.js"></script>
    
    <style>
	th { border-color:#FFFFFF;
	}
	
	th, tr, td {
		padding:3px 3px 3px 3px !important;
	}
	</style>
</head>

<body>

<!--#include virtual="/includes/c1-admin-nav.html" -->

<div id="sidebar">
		<div class="option">
		</div>
</div>

<div id="content" style="width:1000px">
	<h1><span class="title-section">Products &#187;</span> Categories</h1>




<form method="POST" action="builder.html" enctype="multipart/form-data">

<fieldset style="float:left; min-height:700px">
<legend>Category Filters</legend>
<div>
		<label>Category</label>
		<select name="cat" id="cat" width=5 onChange="submit()">
				<option value="">None</option>
				<?parents?>
		</select><br/>
</div><br/>

</form>

<form method="POST" action="builder.html" enctype="multipart/form-data">
	<input type="hidden" name="cat" value="<?cat?>" />
    <?loop filters?>
		<div style="margin-left: 10px; margin-top:20px">


		<label>Filter: <strong><?name?></strong></label>

				<button type="submit" name="Edit" value="<?id?>">Edit</button>
				<br/>
			<div style="margin-left: 30px">
				<?loop options?>
				<?name?> <br/>
				<?endloop options?>
			</div>


		</div>
		<br/>
    <?endloop filters?>


	<?if filter.name?>
		<div style="margin-left: 10px; margin-top:50px">
            FILTER: <input type="text" name="filtername" value="<?filter.name?>" /><br/>

			<?loop filter.options?>
            <label>	OPTION: </label> <input type="text" name="options" value="<?name?>" /><br/>
			<?endloop filter.options?>

		</div>
	<?endif filter.name?>
		<br/>
<div class="button-bar" >
           	<input type="hidden" name="fid" value="<?fid?>" /><br/>
			<button type="submit" name="New" value="1">New</button>
	<?if filter.name?>
			<button type="submit" name="Save" value="1">Save</button>
			<button type="submit" name="Delete" value="1" onClick="return confirm('Delete this Filter?')">Delete</button>
	<?endif filter.name?>
</div>
</fieldset>

<fieldset  style="min-height:700px">
<legend>Product Builder</legend>
		<?loop fields?>
		<?eval( $variable->{value} = $variable->{$variable->{fname}} ) ?>
	
			 <?if big?>
				<label style="width:8em"><?desc?></label>
				<textarea name="<?fname?>" style="width:250px; float:right" ><?value?> </textarea>
			 <?else big?>
				<label style="width:8em"><?desc?></label>
			 	<input name="<?fname?>" value="<?value?>" style="width:250px; float:right" />
			 <?endif big?>
			<br/>

		<?endloop fields?>
<div class="button-bar" >
			<button type="submit" name="Build" value="1">Build</button>
			<button type="submit" name="Preview" value="1">Preview</button>
</div>
</fieldset>

<?if list?>
<fieldset style="clear: both">
		<?loop list?>
			 <strong>ID:</strong> <?strid?> 
			 <strong>Name:</strong> <?name?> 
			 <br/>
		<?endloop list?>
</fieldset>
<?endif list?>
   

 
  </form>
 </div>

<div  style="float:bottom">
<!--#include virtual="/includes/administrator/admin-footer.html" -->
</div>
</body>
</html>
