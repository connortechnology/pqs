<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	<title>
		<!--#include virtual="/includes/web_page_title.html" -->
		Paper - View Price Lists
	</title>

	<!--#include virtual="/includes/web_page_meta.html" -->
	<!--#include virtual="/includes/h1-admin-css.html" -->
	
	<link href="/styles/forms.css" rel="stylesheet" media="screen" />

	<!--#include virtual="/includes/h2-js.html" -->

	<script type="text/javascript" src="/javascripts/other.js"></script>
</head>

<body>
<!--#include virtual="/includes/c1-admin-nav.html" -->
<div id="content">
	<h1><span class="title-section">System &#187; Stock &#187;</span> Price Lists &#187; Details</h1>

	<p>Paper unit prices for price list: <?PriceListName?></p>

	<p>Click on a <strong> Paper ID </strong> to edit its pricing.</p>

	<form name="f1" method="post" enctype="multipart/form-data">
		<table border="0" cellspacing="0" cellpadding="0" class="no-formatting colRow">
			<tr>
				<th colspan="1" style="width: 14em; text-align: left;">Paper Brand</th>
				<th colspan="3" style="text-align: left;">Paper ID</th>
				<th colspan="3">&nbsp;</th>
			</tr>
			<? while ( @$variable{'prod_index','prod_name','prod_id'} = splice @{$$variable{'PRODUCTS'}},0,3; ) ?>

			<tr class="colRow">
				<td colspan="1" style="text-align: left;"><a href="/administrator/paper/paper_prices.html?btnFunction=Display&ddmPaper=<?prod_index?>"><?prod_name?></a></td>
				<td colspan="3" style="vertical-align: bottom;"><?prod_id?>&nbsp;</td>
				<td colspan="3" style="text-align: right;">&nbsp;</td>
			</tr>
			<tr>
				<td colspan="2">&nbsp;</td>
				<td style="text-align: center;">Range</td>
				<td style="text-align: left;">Units</td>
				<td style="text-align: right;">Cost</td>
				<td style="text-align: right;">Markup</td>
				<td style="text-align: right;">Price </td>
			</tr>
			<? while ( @$variable{'min','max','units','cost','markup','price'} = splice @{$$variable{"PRICES_$$variable{'prod_index'}"}},0,6; ) ?>
			<tr>
				<td>&nbsp;</td>
				<td><?equipment?></td>
				<td style="text-align: center;"><?min?>
					&nbsp;-&nbsp;
					<?max?></td>
				<td><?units?></td>
				<td style="text-align: right;">&nbsp;
					<?cost?></td>
				<td style="text-align: right;">&nbsp;
					<?markup?></td>
				<td style="text-align: right;">&nbsp;
					<?price?></td>
			</tr>
			<? endwhile ( @$variable{'min','max','units','cost','markup','price'} = splice @{$$variable{"PRICES_$$variable{'prod_index'}"}},0,6; ) ?>
			<? endwhile ( @$variable{'prod_index','prod_name','prod_id'} = splice @{$$variable{'PRODUCTS'}},0,3; ) ?>
		</table>
	</form>
</div>
<!--#include virtual="/includes/administrator/admin-footer.html" -->
</body>
</html>
