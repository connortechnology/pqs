			<label for="ddmCustomers">Company:</label>
			<select id="ddmCustomers" name="ddmCustomers" size="1">

				<?COMPANY?>
			</select>
			<br />

			<label for="ddmBalance">Balance:</label>
			<select id="ddmBalance" name="ddmBalance" size="1">
				<option value="All"   > All </option>
				<option value="Owing" > Owing </option>
				<option value="Paid"  > Paid </option>
			</select>
			<br />

			<label for="ddmCategories">Category:</label>
			<select id="searchCategory" name="searchCategory" size="1">

				<?BILL_CATEGORY?>
			</select>
			<br />

			<label for="ddmStartMonth">Start Date:</label> <input id="DPC_startdate" name="startdate">

			<label for="ddmENDDate">End Date:</label> <input id="DPC_enddate" name="enddate">
			<br/>


			<label for="dblTotal1">Total Price Range:</label>
			<input type="text" id="dblTotal1" name="dblTotal1" size="9" class="smBox" value="<?dblTotal1?>" />
			<label for="dblTotal2" class="value">&nbsp;to&nbsp;</label>
			<input type="text" id="dblTotal2" name="dblTotal2" size="9" class="smBox" value="<?dblTotal2?>" />
			<br />
	
			<div class="button-bar indent-regular">
				<input class="button" type="reset" />

				<br />
			</div>
			<br />
		</fieldset>

<style>

		<fieldset class="idden-details">
			<legend/> 
				Enter New Bill
			</legend>


				<label>Vendor</label> <select name=company id=company> <?COMPANY?> </select> <br />

				<label>Category</label> <select name=category id=category style="margin: auto"> <?BILL_CATEGORY?> </select> <br/>

				<label>Bill Date</label> <input type=text name=billdate id=DPC_billdate> <br />

				<button name="save_bill" value=1>Save</button>
		</fieldset>

		<fieldset class="idden-details">

				Pay Bill
			</legend>

				<label>Note</label> <input type=text name=paynote id=paynote> <br />


				<button name="pay_bill" value=1>Save</button>
		</fieldset>


		<fieldset>

				Results
			</legend>

<input type="hidden" name="sortfield" 		id="sortfield" value="aaa" />

 <table>

		<th></th>

		<?endloop fields?>

     
    </tr>

			 <?else big?>

					<!-- ***** -->
					<input name="<?fname?>[<?id?>]" value="<?value?>" class="<?class?>"  />

			 <?endif big?>
				
			<?endif ro?>
