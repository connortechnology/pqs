<div class="PhotoAlbums">
	<div class="Assets">
		<?include(/includes/error_reporting.html)?>
		<form name="f1" id="f1" method="post">
			<fieldset class="filters"><legend>Photos</legend>
				<div class="content">
					<ul>
					<? if ( sets::isin( $session{'user_type'}, [ 'E', 'A' ] ) ) ?>
					<li><label><? echo ( translate('Company') ) ?></label>
						<select name="company_id" id="company_id" onchange="new Ajax.Updater('user_id','/includes/_users.html', { parameters: { company_id: this.value }, onSuccess: function(){new Ajax.Updater('Results','_photos.html', { parameters: $('f1').serialize() } );} } );">
							<option value=""> all </option>
							<? echo ( 
								ssi::make_drop_down( openprint::Company->dropdown(), $session{'/photo_albums/photos.html?company_id'} );
							) ?>
						</select>
					</li>
					<li><label>User</label>
						<select name="user_id" id="user_id" onchange="new Ajax.Updater('Results','_photos.html', { parameters: this.form.serialize() } );">
							<option value=""> all </option>
							<? echo ( 
								ssi::make_drop_down( [ map { $_->id(), $_->name() } openprint::User->find('order'=>'lower(firstname),lower(lastname)') ], $session{'/photo_albums/photos.html?user_id'} );
							) ?>
						</select>
					</li>
					<? endif ( sets::isin( $session{'user_type'}, [ 'E', 'A' ] ) ) ?>
					</ul>
				</div>
			</fieldset>
			<div id="Results"><?include(_photos.html)?></div>
		</form>
	</div>
</div>
