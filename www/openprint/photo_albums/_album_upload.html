<script>
window.addEventListener('DOMContentLoaded',function(){
console.log("Setting up FindUploader");
	const uploader = new qq.FineUploader({
    debug: true,
    element: document.getElementById('fine-uploader'),
    request: {
      endpoint: '/upload.htm',
      paramsInBody: false,
      params: {
        id: '<? echo ( $$variable{Album}->id() ) ?>',
        UploadType: '<? echo ( my $type = ref $$variable{Album}; $type =~ s/^openprint:://; return $type; ) ?>'
      }
    },
    validation: {
			allowedExtensions: ['jpg', 'jpeg', 'png', 'gif','bmp','pdf','flv','avi','mp4'],
			sizeLimit: 1024*1024*1024
		},
		callbacks: {
			onComplete: function(id, fileName){
				new Ajax.Updater('Photos', '/photo_albums/_album_photos.html', {
          parameters: {
            album_id: '<? echo ( $$variable{Album}->id() ) ?>',
            album_type: '<? echo ( ref $$variable{Album} ) ?>'
          }
        });
			}
		},
		dragAndDrop: {
			hideDropzones: false
		},
		failedUploadTextDisplay: {
			mode: 'custom',
		},
    retry: {
      enableAuto: true // defaults to false
    }
  });
});

</script>
