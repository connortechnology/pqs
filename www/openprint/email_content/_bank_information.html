<div class="BankInformation">
<fieldset><legend>Bank Information</legend>
	<ul>
		<li class="bank_name"> 
			<label>Bank Name</label>
			<span class="input"><? hecho ( $$variable{Company}->bank_name() ) ?></span>
		</li>
		<li class="bank_branch"> 
			<label>Branch #</label>
			<span class="input"><? hecho ( $$variable{Company}->bank_branch() ) ?></span>
		</li>
		<li class="bank_account"> 
			<label>Bank Account #</label>
			<span class="input"><? hecho ( $$variable{Company}->bank_account() ) ?></span>
		</li>
		<li class="account_manager"> 
			<label>Account Manager</label>
			<span class="input"><? hecho ( $$variable{Company}->bank_manager() ) ?></span>
		</li>
		<li class="bank_phone"> 
			<label>Bank Phone</label>
			<span class="input"><? hecho ( $$variable{Company}->bank_phone() ) ?></span>
		</li>
		<li class="bank_fax"> 
			<label>Bank Fax</label>
			<span class="input"><? hecho ( $$variable{Company}->bank_fax() ) ?></span>
		</li>
		<li class="bank_email"> 
			<label>Bank E-mail</label>
			<span class="input"><? hecho ( $$variable{Company}->bank_email() ) ?></span>
		</li>
	</ul>
</fieldset>
</div>
