<form id="PopupForm" name="PopupForm" method="post" action="sites.html">
  <input type="hidden" name="site_id" value="<?echo($$variable{Site}->id())?>"/>
	<input type="hidden" name="action"/>
	<fieldset class="filters"><legend>Search Criteria</legend>
		<ul>
		<li class="ipaddress">
			<label for="ip">Host IP</label>

			<label>Hostname</label>

		</li>
		<li class="mac">
      <label>MAC</label>

				button( 'ShowResults', { onclick=>"load_host($('PopupForm'));", text=>'Show Results' } ),
				); ) ?>

</form>
