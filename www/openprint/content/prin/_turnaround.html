<? echo (
	my $Service = openprint::Service->find_one('name'=>'Turnaround'.$$variable{'Project'}->Type()->name());
	$Service = openprint::Service->find_one('name'=>'Turnaround');
	my $html;
	if ( $Service ) {
		$html .= q`<li id="Turnaround"><label>Turnaround</label>
	<select id="TurnaroundDays" name="TurnaroundDays" size="1" onchange="remove_div('OrderButton');calc(this.form.name);">`;
		my @Prices = openprint::ServicePrice->find( 'service_id'=>$$Service{id}, 'pricelist_id'=>$session{'Pricelist_id'}, 'order'=>'min DESC NULLS LAST,max DESC NULLS LAST' );
		my @options;
		foreach my $Price ( @Prices ) {
			if ( $Price->min() == $Price->max() ) {
				if ( $Price->min() == 1 ) {
					push @options, int($Price->min()), '24 hours after approval';
				} else {
					push @options, int($Price->min()), int($Price->min()) . ' days after approval';
				}
			} else {
				push @options, int($Price->min()).'-'.int($Price->max()), int($Price->min()).'-'.int($Price->max()) . ' days after approval';
			} # end if
		} # end foreach $Price
		$html .= ssi::make_drop_down( \@options, $$variable{'TurnaroundDays'} );
		$html .= '</select></li>';
	} # end if
	return $html;
) ?>
