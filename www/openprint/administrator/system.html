<form action="system.html" method="post">
<fieldset><legend>Reboot</legend>
  <p>Reboot the server.  All users will be logged off, services will stop and the Server will restart.</p>
  <button type="submit" name="action" value="reboot">Reboot</button>
</fieldset>
<fieldset><legend>Shutdown</legend>
  <p>Shutdown the server.  All users will be logged off, services will stop and the Server will power off.</p>
  <button type="submit" name="action" value="shutdown">Shutdown</button>
</fieldset>
</form>
