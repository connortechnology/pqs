<li>
	<label><? echo (
	if ( $$variable{ServiceTypeName} eq 'Banding' ) {
		return 'Band quantity';
	} else {
		return 'Package quantity';
	} # end if
) ?></label>
	<? echo ( my $html;
		foreach my $qty_index ( $$variable{Project}->quantity_indexes() ) {
			$html .= '<span class="'.$$variable{Columns}.'Columns">';
			$html .= input( name=>'txtPackageQuantity'.$qty_index, type=>'cardinal', value=>$$variable{'txtPackageQuantity'.$qty_index}, oninput=>'calc(this.form.name);' );
			$html .= '</span>';
		} # end foreach
		return $html;
	) ?>
</li>
