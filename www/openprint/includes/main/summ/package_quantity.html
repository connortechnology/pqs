<p>
    <label><?ServiceTypeName?> quantity</label>
   <? eval ( $$variable{'QTYIndex'} = 1 ) ?>
    <? while ( $$variable{'QTYIndex'} <= 3 ) ?>
<? if ( $$variable{'Project'}->quantity($$variable{'QTYIndex'}) ) ?>
    <span class="value"><? echo ( $$variable{'txtPackageQuantity'.$$variable{'QTYIndex'}} ) ?></span>
<? endif ( $$variable{'Project'}->quantity($$variable{'QTYIndex'}) ) ?>

    <? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
