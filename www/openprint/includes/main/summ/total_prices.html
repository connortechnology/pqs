<p>
	<label><b>Unit Price</b></label>
    <? eval ( $$variable{'QTYIndex'} = 1 ) ?>
    <? while ( $$variable{'QTYIndex'} <= 3 ) ?>
    <? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="value"><b>$ <? echo ( $$variable{'UNITPRICE'.$$variable{'QTYIndex'}} ) ?></b></span>
    <? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <? eval ( $$variable{'QTYIndex'} += 1 ) ?>
    <? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
<p>
	<label><b>Total Service Price</b></label>
    <? eval ( $$variable{'QTYIndex'} = 1 ) ?>
    <? while ( $$variable{'QTYIndex'} <= 3 ) ?>
    <? if ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
	<span class="value"><b>$ <? echo ( $$variable{'TOTAL'.$$variable{'QTYIndex'}} ) ?></b></span>
    <? endif ( $$variable{'txtQuantity'.$$variable{'QTYIndex'}} ) ?>
    <? eval ( $$variable{'QTYIndex'} += 1 ) ?>
    <? endwhile ( $$variable{'QTYIndex'} <= 3 ) ?>
</p>
