<script type="text/javascript">
	function calc( formName, force ) {
		form = $(formName);
		if ( gettingNewPrice && ! force ) {
			if ( timeout )
				clearTimeout( timeout );
			setTimeout( "calc('"+formName+"');", 1000 );
			return;
		} // end if
		timeout = null;
		gettingNewPrice = true;
		var form = getFormObj( formName );
		var h = $H(form.serialize(true));
		h.each(function(pair) {
				if ( pair.value == '' )
				h.unset(pair.key);
				if ( pair.key == 'btnFunction' ) 
				h.unset(pair.key);
				});
		h.set('ServiceType','ChannelLetters');
		new Ajax.Request( '/main/project/_calc.json', { method: 'post', parameters: h, evalScripts: true } );
	}
</script>
