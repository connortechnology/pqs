  <fieldset>

        <label>Is this a reprint?</label>

            'Customer','Customer',
            'Docket','Docket',
            'Prepress','Prepress',
            'Printing','Printing',
            'Bindery','Bindery',
            'Shipping','Shipping',
            'Supplier - Service','Supplier - Service',
            'Supplier - Material', 'Supplier - Material',
            'Other', 'Other',
            ], $$variable{Project}{reprint_reason} );) ?>
        </select>
        <textarea name="reprint_description"><?echo($$variable{Project}->reprint_description())?></textarea>

    </ul>
