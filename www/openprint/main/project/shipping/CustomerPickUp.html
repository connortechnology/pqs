<script type="text/javascript">
function calc( formName ) {
        if ( gettingNewPrice ) {
            if ( timeout ) {
                clearTimeout( timeout );
            } // end if
            if ( ! force ) {
                setTimeout( "calc('"+formName+"');", 1000 );
                return;
            } // end if
        } // end if
        timeout = null;
        gettingNewPrice = true;

		remove_div('AlertDiv');
		var form = getFormObj( formName );

		var h = $H(form.serialize(true));
		h.set('ServiceType', 'CustomerPickUp');
		h.set('callback','cbFillUPSResults');
		new Ajax.Request( '/main/project/_calc.json', { method: 'post', parameters: h, evalScripts: true } );
	} // end if
} // end calc()
function cbFillUPSResults( results ) {
	cbFillResults( results );
	var form = getFormObj( 'f1' );
	if ( ( form.elements['NeedPlainCartons'].value > 0 ) && confirm('Your project must be packed in cartons.  Would you like to add cartons to your project?' ) ) {
		addService( 'f1', 'PlainCartons' );
	} // end if
}
function validate_data(formName) {
	var form = getFormObj( formName );
	var text = '';
	return true;
} // end function
</script>
<div class="Service">
	<form id="f1" name="f1" method="post" action="/main/project/view.html">

			<ul>
			<li><label># of items to pickup</label>
				<? echo ( my $html;
					foreach my $qty_index ( $variable{Project}->quantity_indexes() ) {
						$html .= '<span class="'.$$variable{Columns}.'Columns">';
						$html .= input( type=>'cardinal', name=>'txtQuantity'.$qty_index, value=>$$variable{'txtQuantity'.$qty_index}, onkeyup=>'calc(this.form.name);' );
						$html .= '</span>';
					} # end foraech
					return $html;
				) ?>
			</li>

			</ul>
