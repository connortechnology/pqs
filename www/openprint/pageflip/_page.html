<form id="f1" name="f1" method="post" action="/pageflip/view.html?pageflip_id=<? echo ( $$variable{'PageFlip'}->id() ) ?>">
	<input type="hidden" name="command" />
	<input type="hidden" name="page_id" value="<? echo ( $$variable{'Page'}->id() ) ?>" />
	<p class="buttons">
		<? echo ( ssi::writeButton($log, $dbh, 'save', 'save.gif', q`f1.command.value='Save';f1.submit();`, '', 'Save' ); ) ?>
	</p>
	<p>
		<label>Resolution</label>
		Source: 
		<input type="text" name="src_width" id="src_width" value="<? echo ( $$variable{'Page'}->src_width() ) ?>" size="4" />
		x
		<input type="text" name="src_height" id="src_height" value="<? echo ( $$variable{'Page'}->src_height() ) ?>" size="4" />
		Output:
		<input type="text" name="width" id="width" value="<? echo ( $$variable{'Page'}->width() ) ?>" size="4" onkeyup="update_resolution(this);" />
		x
		<input type="text" name="height" id="height" value="<? echo ( $$variable{'Page'}->height() ) ?>" size="4" onkeyup="update_resolution(this);" />
	</p>
	<p>
		<label>Cropping Box</label>
		Top: <input type="text" name="crop_top" id="crop_top" value="<? echo ( 1*$$variable{'Page'}->crop_top() ) ?>" size="4" onkeyup="this.value=this.value.replace(/[^\-\d]/g,'');$('CropTop').style.top=this.value+'px';" />
		Left: <input type="text" name="crop_left" id="crop_left" value="<? echo ( 1*$$variable{'Page'}->crop_left() ) ?>" size="4" onkeyup="this.value=this.value.replace(/[^\-\d]/g,'');$('CropLeft').style.left=this.value+'px';" />
		x
		Bottom: <input type="text" name="crop_bottom" id="crop_bottom" value="<? echo ( 1*$$variable{'Page'}->crop_bottom() ) ?>" size="4" onkeyup="this.value=this.value.replace(/[^\-\d]/g,'');$('CropBottom').style.top=this.value+'px';" />
		Right: <input type="text" name="crop_right" id="crop_right" value="<? echo ( 1*$$variable{'Page'}->crop_right() ) ?>" size="4" onkeyup="this.value=this.value.replace(/[^\-\d]/g,'');$('CropRight').style.left=this.value+'px';" />
	</p>
	<p>
		<label>Save crops to all pages with similar src resolution?</label>
		<input type="radio" id="save_to_all1" name="save_to_all" value="1" />
		<label class="radio" for="save_to_all1">Yes</label>
		<input type="radio" id="save_to_all0" name="save_to_all" value="0" checked="checked" />
		<label class="radio" for="save_to_all0">No</label>
	</p>
	<img id="PageImage" src="/PageFlip/LR/<? echo ( $$variable{'Page'}->filename() ) ?>" alt="" style="width: <? echo ( $$variable{'Page'}->width() ) ?>px; height: <? echo ( $$variable{'Page'}->height() ) ?>px;" />
	<div id="Page" style="width: <? echo ( $$variable{'Page'}->width() ) ?>px; height: <? echo ( $$variable{'Page'}->height() ) ?>px;" >
		<div id="CropBox">
			<div id="CropTop" style="top: <? echo ( 1*$$variable{'Page'}->crop_top() ) ?>px; bottom: auto;"></div>
			<div id="CropBottom" style="top: <? echo ( 1*$$variable{'Page'}->crop_bottom() ) ?>px; bottom: auto;"></div>
			<div id="CropLeft" style="left: <? echo ( 1*$$variable{'Page'}->crop_left() ) ?>px; right: auto;"></div>
			<div id="CropRight" style="left: <? echo ( 1*$$variable{'Page'}->crop_right() ) ?>px; right: auto;"></div>
		</div>
	</div>
</form>
<script type="text/javascript">

		$('CropTop').observe( "mousedown", start_drag );
		$('CropBottom').observe( "mousedown", start_drag );
		$('CropLeft').observe( "mousedown", start_drag );
		$('CropRight').observe( "mousedown", start_drag );
		document.observe( "mouseup", stop_drag );
-->
</script>
