<script type="text/javascript">
function load_records( form, options ) {
	var p = form.serialize(true);
	if ( options && options.order )
		p.order = options.order;
	
	new Ajax.Updater( 'Results','/employee/it/_radius.html', { parameters: p } );
} // end function load
function new_record( ) {
	new Ajax.Request('_radius_mac_line.html', { 
		parameters: {
			action: 'add', 
			username: $('username').value, 
			attribute: $('attribute').getValue(),
			value: $('value').value
		}, 
		evalScripts:true, 
		onSuccess: function(response) { 
			$('Results').insert({top: response.responseText} ); 
			SortableTable.load();   
			} 
	} );
} // end function new_record
</script>
<?include('/includes/error_reporting.html')?>
Please select a host to view/edit.<br>

			</li>
