<div class="Vendor">
	<fieldset><legend>VENDOR</legend>
		<ul>
		<li><label>Select</label>
			<input type="text" onkeyup="filterDDM(this, this.form.supplier_id);" onkeydown="if(event.keyCode == 13){this.form.supplier_id.onchange();}" class="filter" />
			<select id="supplier_id" name="supplier_id" onchange="new Ajax.Request('_select_vendor.json', {method:'get', parameters: { supplier_id: this.value } } );">
				<option value="">select</option>
				<? echo ( make_drop_down( [ map { $_->id(), $_->name() } openprint::Company->find( order=>'lower(name)', supplier=>'Y') ], $$variable{Claim}->supplier_id() ); ) ?>
			</select>
		</li>
		<li id="contacts" <? echo ( $$variable{'Claim'}->supplier_id() ? '' : ' style="display:none;"' ) ?>><label>Available Contacts</label>
			<select id="contact_id" name="contact_id" onchange="new Ajax.Request('_select_contact.json', {method:'get', parameters: { contact_id: this.value } } );">
				<option value="">select</option>
				<? echo ( 
					if ( $$variable{Claim}->supplier_id() ) {
						my @Users = openprint::User->find(company_id=>$$variable{Claim}->supplier_id(), name=>$$variable{Claim}->vendor_contact() );
			
						return make_drop_down( openprint::User->dropdown( order=>'lower(firstname),lower(lastname)', company_id=>$$variable{Claim}->supplier_id() ), @Users ? $Users[0]->id() : undef );
					} # end if
					return;
				) ?>
			</select>
		</li>
		<li><label for="vendor_contact">Contact</label><input type="text" name="vendor_contact" id="vendor_contact" value="<? echo ( $$variable{'Claim'}->vendor_contact() ) ?>" /></li>
		<li><label for="vendor_name">Name</label><input type="text" name="vendor_name" id="vendor_name" value="<? echo ( $$variable{'Claim'}->vendor_name() ) ?>" /></li>
		<li><label for="vendor_address1">Address</label><input type="text" name="vendor_address1" id="vendor_address1" value="<? echo ( $$variable{'Claim'}->vendor_address1() ) ?>" />
		<input type="text" name="vendor_address2" id="vendor_address2" value="<? echo ( $$variable{'Claim'}->vendor_address2() ) ?>" /></li>
		<li><label for="vendor_country">Country</label>
			<select id="vendor_country" name="vendor_country" onchange="Country_onchange( this, this.form.vendor_state );">
				<option value=""> select </option>
				<? echo ( return_countries($$variable{'Claim'}->vendor_country() ); ) ?>
			</select>
		</li>
		<li><label for="vendor_state"><span id="vendor_country_state"><? echo (
				if ( $$variable{Claim}->vendor_country() eq 'US' ) {
					return 'State';
				} elsif ( $$variable{Claim}->vendor_country() eq 'CA' ) {
					return 'Province';
				} else {
					return 'State/Province';
				} # end if
			) ?></span></label>
			<select id="vendor_state" name="vendor_state">
			<option value=""> Select </option>
			<? echo ( return_states_and_provinces($$variable{'Claim'}->vendor_state()); ) ?>
			</select>
		</li>
		<li><label for="vendor_city">City</label><input type="text" name="vendor_city" id="vendor_city" value="<? echo ( $$variable{'Claim'}->vendor_city() ) ?>" /></li>
		<li><label for="vendor_postalcode"><span id="vendor_country_postal"><? echo (
				   if ( $$variable{'Claim'}->vendor_country() eq 'US' ) {
					   return 'Zip Code';
				   } elsif ( $$variable{'Claim'}->vendor_country() eq 'CA' ) {
					   return 'Postal Code';
				   } else {
					   return 'Zip/Postal Code';
				   } # end if
				) ?></span></label><input type="text" name="vendor_postalcode" id="vendor_postalcode" value="<? echo ( $$variable{Claim}->vendor_postalcode() ) ?>" /></li>
		<li><label for="vendor_phone">Phone</label><input type="tel" name="vendor_phone" id="vendor_phone" value="<? echo ( $$variable{Claim}->vendor_phone() ) ?>" /></li>
		<li><label for="vendor_fax">Fax</label><input type="tel" name="vendor_fax" id="vendor_fax" value="<? echo ( $$variable{Claim}->vendor_fax() ) ?>" /></li>
		<li><label for="vendor_sms">SMS</label><input type="tel" name="vendor_sms" id="vendor_sms" value="<? echo ( $$variable{Claim}->vendor_sms() ) ?>" /></li>
		<li><label for="vendor_email">Email</label><input type="email" name="vendor_email" id="vendor_email" value="<? echo ( $$variable{Claim}->vendor_email() ) ?>" /></li>
		</ul>
	</fieldset>
</div>
