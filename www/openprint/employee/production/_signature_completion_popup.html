<?include(/includes/error_reporting.html)?>
<? if ( $$variable{Job}->id() ) ?>
<form id="completion_form" name="completion_form" action="print_overview.html" method="post">
	<input type="hidden" name="btnFunction" value="CompleteJob" />
	<input type="hidden" name="schedule_id" value="<? echo ( $param{schedule_id} ) ?>" />
	<fieldset><legend>Signature Completion</legend>
		<p>
			<label>Operator</label>
			<select name="operator_ids" id="operator_ids" multiple="multiple">
				<option value="">select</option>
				<? echo ( 
					my $operator_ids = $$variable{Job}->operator_ids();
					if ( ! ( $operator_ids and @{$operator_ids} ) ) {
						$log->debug("No operator_ids for " . $$variable{Job}->to_string());
						$operator_ids = [ $session{user_id} ] ;
					}

					$log->debug("Popup for " . $$variable{Job}->to_string() );

					my @categories = $$variable{Job}->Equipment()->categories();
					if ( ! @categories ) {
						$log->error("No categories for " . $$variable{Job}->Equipment()->name()  . $$variable{Job}->to_string() );
						return;
					} else {
					$log->debug("Categories: @categories");
					}
					my @Usergroups = openprint::UserGroup->find( name=> \@categories );
					if ( ! @Usergroups ) {
						$log->error("No usergroups found for categories @categories");
						return;
					}
					my @Usersin = openprint::User_in_UserGroup->find( usergroup_id=>[ map { $$_{id} } @Usergroups ] );
					if ( ! @Usersin ) {
						$log->error("No users found for groups: " . join(',', map { $$_{id} } @Usergroups ) );
					}
					my @user_ids = sets::union( (map { $_ ? $_ : () } @{$operator_ids}), map { $$_{user_id} ? $$_{user_id} : () } @Usersin);
$log->debug("operator_ids: @{$operator_ids}:".join(',',@{$operator_ids}).':'.@{$operator_ids});
$log->debug("operator_ids: @user_ids");

					make_drop_down( openprint::User->dropdown(id=>\@user_ids), $operator_ids );
				) ?>
			</select>
		</p>
		<p class="buttons">
			<? echo ( join("\n",
				button( 'Submit', { onclick=>"new Ajax.Request('_li_change.json', {parameters:\$('completion_form').serialize(), onSuccess: function(){popupWin.destroy();} } );" } ),
				button( 'Cancel', { onclick=>'popupWin.destroy();' } ),

			); ) ?>
		</p>
	</fieldset>
</form>
<? else ( $$variable{Job}->id() ) ?>
<? echo ( button( 'Close', { onclick=>'popupWin.destroy();' } ); ) ?>
<? endif ( $$variable{Job}->id() ) ?>
<script type="text/javascript">$j('#operator_ids').chosen();</script>
