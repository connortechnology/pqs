<style>
	
	@media print {
		#submitButton {
			display: none;
		}
		input { border: none; }
		.noprint { display: none; }


		
		body { font-size:12pt; }

		div { padding-top: 5px; }

	}

	#jobname { 
		font-size: 16pt; 
		font-weight: bold;
	}

	.head {
		display: inline-block;
		vertical-align: bottom;
		text-align: center;
	}
	.pslogo {
		/*width: 100%;*/
		height: 100%;
		
	}
	.show_border {
		border: none;
		/*border: 1px solid black;*/
	}
	.botbord {
		border-bottom: 2px solid black;
		padding-bottom: 15px;
	}
	div {
		display: inline-block;
	}
	.fullwidth {
		width: 100%;
	}
	.fullheight {
		height: 100%;
	}
	.label {
		padding: 5px 0 5px 0;
		font-size:13pt;
		display: inline-block;
		font-weight: bold;
	}
	.large_font span {
		font-size:19pt;
	}
	.rightcol {
		float:right;
		width:40%;
	}
	.large_font input {
		font-size:26pt;

		padding-left: 1em;
	}

	.date{ text-align: right; padding-top: 30px; font-size: 15pt; }

	.space1 { line-height: 50px; }
	.space2 { line-height: 50px; }
	.space3 { line-height: 50px; }

	.signature {
    	border: 0;
    	border-bottom: 1px solid #000;
		width: 300px;
		margin-bottom: 40px;
	}

	.bottom > * {
  		vertical-align: bottom;
	}

</style>
	<script>
		function blind () {
			  var x = document.getElementById("logo");
  if (x.style.display === "none") {
    x.style.display = "block";
  } else {
    x.style.display = "none";
  }
		}
	</script>

<form name="packing_slip_form" action="/main/order/packing_slip.html" >

<div class="fullwidth botbord">
	<div class="head fullheight" style="width: 443px; height:125px">
	<img src="<?logo?>" class="pslogo" id="logo" />
	</div>

	<div class="head fullheight" style="width:520px">
	  <p style="font-size:36px;  text-align: center">PACKING SLIP</p>
	  <br />
	  <p style="font-size: 28pt;">Order Number: <?order_id?> </p>
	</div>


	<div style="width:100%">	
		<div style="width: 50%" > <input type="button" onClick="blind()" value="Blind" class="noprint" ></div>

	<div class="head bottom fullheight" style="width: 50%; float: right;">
		<h2 class="date"> <?date?></h2>
	</div>

	</div>
</div>


<div style="" class="fullwidth botbord">
				<div style="float: left; width: 55%;" class="show_border fullheight">
					<span style="padding-top: 20px; font-size: 16pt; display: block">
						Company Name: <?order.strshippingcompanyname?> 
					</span>
					<span class="noprint" style="position:relative; top: 36px;">
					PROJECT: <select id="pid" name="pid" onChange="this.form.packid.value='';this.form.submit()">
						<?loop PIDS?>
						<option value="<?lngprojectindex?>"><?lngprojectindex?></option>
						<?endloop PIDS?>
					</select>
					</span>
				</div>
				<div style="" class="show_border fullheight rightcol">
					<span class="label">Contact Name: 	</span> <?txtContact?> <?order.strshippingfirstname?> <?order.strshippinglastname?>  <br/>
					<span class="label">Phone:  	</span>  <?order.strshippingphone?> <br/>
					<span class="label">E-mail:   	</span> <?order.strshippingemail?>   <br/>
				</div>
</div>




<div class="fullwidth botbord" style="">
	<div class="fullheight show_border" style="float: left; width: 55%;">
		<span class="label">Job Name:</span> <span id="jobname"><?project.strprojectreference?></span>  <br/>
		<span class="label">Master Size:</span> <?docket.final_width?> x <?docket.final_height?>  <br/>
		<span class="label">Category:</span> <?docket.ptype?>  <br/>
	</div>

	<div class="fullheight show_border rightcol" style="">
		<span class="label">Master Quantity:</span> <?docket.qty1?>  <br/>
		<span class="label">P.O Number:</span> <?order.strponumber?>  <br/>
	</div>

</div>

<div class="fullwidth" style="">
	<div class="fullheight show_border large_font" style="float: left; width: 50%;">
		<span class="label">No. of Boxes:</span> 
		<input name="boxes" value="<?boxes?>" id="boxes" size=6 class="large_font"/>
		<br/>
	</div>

	<div class="fullheight show_border large_font rightcol" style="">
		<span class="label">Delivered Qty:</span> 
		<input name="ship_qty" value="<?ship_qty?>" id="ship_qty" size=6 class="large_font" />
		<br/>
	</div>

</div>


<div class="space4"> &nbsp; </div>
<div class="fullwidth" style="">
	<div class="fullheight show_border" style="float: left; width: 60%;">
		<span class="label">Name (please print):</span> <input type="text" class="signature" /> <br/>
		<span class="label">Customer Signature:</span> <input type="text" class="signature" />  <br/>
	</div>

	<div class="fullheight show_border rightcol" style="">
		<span class="label">Date:</span>  <input type="text" class="signature" /> <br/>
	</div>

	<input type="hidden" value="<?packid?>" name="packid" id="packid"  />
</div>
	<div class="fullheight show_border" style="float: left;margin-top: 50px">
		<span class="label" >Comments: &nbsp; </span> 
		<textarea name="comments" id="comments" style="width:835px;height: 200px; margin-bottom:30px; float:right" /><?comments?></textarea>
		<br/>
	</div>
<input type="submit" style="float:right;" name="Save" id="submitButton" />
</form>
