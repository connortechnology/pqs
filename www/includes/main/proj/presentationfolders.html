	<legend>
		Presentation Folder
	</legend>

	<p>What size of pockets are required for your presentation folder?</p>
	
	<span class="label">&nbsp;</span>

		<label for="rdbPocketSizeCustom" class="radio"><input type="radio" id="rdbPocketSizeCustom" name="rdbPocketSize" value="" />Custom</label><br />

	<br />
</fieldset>
