<fieldset id="stock">
	<legend>Stock</legend>

	<p style="margin-bottom: 0;">Please choose a stock family, coated sides, <?ws_colour?>, and weight.</p>

	<div style="margin-top: 1ex; padding-left: 3em; vertical-align: bottom;"> 
		<div style="margin-top: 3ex; padding-right: 1em;">
			<label for="stock_name" style="width: auto; margin-top: -3ex; padding: 0;">Family:</label><br />
			<select id="stock_name" name="stock_name" style="min-width: 10em;">
				<?loop stock.name ?>
				<option value="<?key?>"><?value?></option>
				<?endloop stock.name ?>
				<option value="">Clear</option>
			</select>
		</div>
	
		<div style="margin-top: 3ex; padding-right: 1em;">
			<label for="stock_finish" style="width: auto; margin-top: -3ex; padding: 0;">Finish:</label><br />
			<select id="stock_finish" name="stock_finish" style="min-width: 10em;">
				<?loop stock.finish ?>
				<option value="<?key?>"><?value?></option>
				<?endloop stock.finish ?>
				<option value="">Clear</option>
			</select>
		</div>
	
		<div style="margin-top: 3ex; padding-right: 1em;">
			<label for="stock_colour" style="width: auto; margin-top: -3ex; padding: 0;"><?ws_Colour?>:</label><br />
			<select id="stock_colour" name="stock_colour" style="min-width: 6em;">
				<?loop stock.colour ?>
				<option value="<?key?>"><?value?></option>
				<?endloop stock.colour ?>
				<option value="">Clear</option>
			</select>
		</div>
	
		<div style="margin-top: 3ex; padding-right: 0.7em;">
			<label for="stock_weight" style="width: auto; margin-top: -3ex; padding: 0;">Weight:</label><br />
			<select id="stock_weight" name="stock_weight" style="min-width: 9em;">
				<?loop stock.weight ?>
				<option value="<?key?>"><?value?></option>
				<?endloop stock.weight ?>
				<option value="">Clear</option>
			</select>
		</div>
	
		<div style="margin-top: 4.4ex; margin-bottom: -1px;">
			<input type="button" id="stock_unbind_all" value="Clear Stock" class="button" />
		</div>
	</div>
	<br />

	<? if ( $variable->{project}{type}{name} eq 'Envelopes') ?>
	<p id="stock_details" style="padding-left: 3em;">Details: <span style="padding-left: 2em;"></span></p>
	<br />
	<? endif ( $variable->{project}{type}{name} eq 'Envelopes') ?>
    
       <? if ($$variable{user_type} ne 'C' ) ?>
                 <div style="padding-left: 3em;">
                 	<div style="margin-top: 3ex; padding-right: 0.7em;">
                    <label for="certification" style="width: auto; margin-top: -3ex; padding: 0;">Certification:</label><br />
                <select id="certified" name="certified" style="min-width: 9em;">
				<option value="">None</option>
                    <option value="fsc">FSC - Forest Stewardship Council Certified</option>
                    <option value="sfi">SFI - Sustainable Forestry Initiative Certified</option>
                    <option value="pefc">PEFC - Programme for the Endorsement of Forest Certification</option>
				</select>
                </div>
                </div><br />
<br />
<br />
<br />

                 <div style="padding-left: 3em;">
                 	<div style="margin-top: 3ex; padding-right: 0.7em;">
                    <label for="secureprint" style="width: auto; margin-top: -3ex; padding: 0;">Secure Print Item:</label><br />
                <input id="secureprint" name="secureprint" type="checkbox" value="1" /> Yes
                 </div>
                </div><br />
                
                
        <? endif ($$variable{user_type} ne 'C' ) ?>
    

	<? if can_supply_stock ?>
		<p>If you&#8216;re supplying your own stock, choose the stock that most closely resembles the stock you&#8216;ll be providing.</p>

		<label for="stock_supplied" class="checkbox" style="padding-left: 3em;"><input id="stock_supplied" name="stock_supplied" type="checkbox" value="1" />I wish to supply my own stock.</label><br />
		
		<div style="width: auto; padding: 0; margin: 0;">
			<label for="stock_custom">Custom Stock Details:</label>
			<textarea id="stock_custom" name="stock_custom"></textarea>
			<br />
		</div>
	<? endif can_supply_stock ?>

	<br />
</fieldset>
