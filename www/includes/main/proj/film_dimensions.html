<fieldset>
	<legend>
		Film Dimensions
	</legend>

	<p>What are the dimensions of the <span class="tip" title="Negatives of an image outputted on an imagesetter for the creation of plates used in printing that image. (1 piece of film per <?ws_colour?> per side)">film</span> required? (Use <span class="tip" title="<!--#include virtual="/includes/fraction_to_decimal_dimensions.html" -->">decimals</span> ex. 8.5)</p>
	
	<label for="txtFilmDimensionWidth">Film Dimensions:</label>
	<input id="flat_width" name="flat_width" size="9" class="smbox" onkeyup="calc('f1');" />
	<input id="flat_height" name="flat_height" size="9" class="smbox" onkeyup="calc('f1');" />
	<label for="txtFilmDimensionHeight" class="post-input">(W x H)</label>
	<br />
</fieldset>
