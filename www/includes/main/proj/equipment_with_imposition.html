<fieldset>
	<legend>
		Imposition &amp; Equipment
	</legend>

	<p class="none">&nbsp;</p>

	<? if project.qty.0 ?>
		<h5>Quantity of <?txtQuantity1?></h5>
		
		<label for="txtImposition1" class="tip" title="Refers to the arrangement of projects or pages on a press sheet or piece of film.">Imposition:</label>
		<input id="txtImposition1" name="txtImposition1" size="9" class="smbox" />
		<label for="txtImposition1" class="post-input">Out</label>
		<label for="chkOverrideImposition1" class="checkbox override-post-label"><input type="checkbox" id="chkOverrideImposition1" name="chkOverrideImposition1" class="override" value="Y" />Override</label>

		<br />

		<div>
			<select id="ddmEquipment1" name="ddmEquipment1" size="1">
