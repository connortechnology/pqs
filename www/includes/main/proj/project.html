<?if not:flags.can_edit ?>
	<!-- This is not a good way to add this CSS. -->
<?endif not:flags.can_edit ?>

	<style type="text/css">.control { visibility: hidden; }</style>

<table id="service-pricing" class="project-current-view no-formatting">
	<col id="service" />
	<col id="qty1" />
	<col id="qty2" />
	<col id="qty3" />
	<col id="status" />
	<col id="changes" class="control" />

	<!-- SERVICES -->
	<thead>
		<tr class="title">
			<th style="border-left-width: 1px;">Services</th>
			<th style="text-align: right;">Quantity&nbsp;&nbsp;&nbsp;<?qty.1?></th>
			<th style="text-align: right;"><?if qty.2?><?qty.2?><?endif qty.2?></th>
			<th style="text-align: right;"><?if qty.3?><?qty.3?><?endif qty.3?></th>
			<th style="text-align: right;">&nbsp;</th>
<!--			<th class="control print-right-border" style="text-align: right; border-right-width: 1px;">Changes</th> -->
			<th class="control print-right-border" style="text-align: center; border-right-width: 0px;">Info &nbsp;&nbsp;   Pricing</th>
		</tr>
	</thead>

	<!-- Service pricing by category. -->
	<tbody>
		<?loop categories?>
			<tr class="category <?name?>">
				<td style="font-weight: bold;">
					<?if ($$variable{url} and $$variable{flags}{can_edit}) ?>
						<a href="/service/<?url?>?pid=<?pid?>;sid=<?id?>"><?name?></a> 
					<?else ($$variable{url} and $$variable{flags}{can_edit}) ?>
						<?name?> 		
					<?endif ($$variable{url} and $$variable{flags}{can_edit}) ?>				</td>

				<td><?money:sub_total1?></td>
				<td><?money:sub_total2?></td>
				<td><?money:sub_total3?></td>
				
				<td></td><td></td>
			</tr>

			<!-- Services in <?category?>. -->				
			<?loop services?>
				<tr class="service <?ref?>">
					<td> &#183; 
						<?if ($$variable{url} and $$variable{flags}{can_edit}) ?>
							<a href="/service/<?lc:ref?>?pid=<?pid?>;sid=<?id?>"><?name?></a>
						<?else ($$variable{url} and $$variable{flags}{can_edit}) ?>
							<?name?>		
						<?endif ($$variable{url} and $$variable{flags}{can_edit}) ?>
						<?if ($$variable{removed}) ?>
							<span class="supplied">(Customer Supplied)</span>
						<?endif ($$variable{removed}) ?>					</td>

					<td style="text-align: right;"><?if rfq_only?>-<?else rfq_only?><?money:price1?><?endif rfq_only?></td>
					<td style="text-align: right;"><?if rfq_only?>-<?else rfq_only?><?money:price2?><?endif rfq_only?></td>
					<td style="text-align: right;"><?if rfq_only?>-<?else rfq_only?><?money:price3?><?endif rfq_only?></td>
					
					<td class="<?status?>" style="text-align: right; color:#F00; text-decoration:blink">
						<?if rfq_only?>
							<?status?>
						<?endif rfq_only?>
					</td>

					<td class="control" style="text-align: center;">
						<?if flags.can_edit ?>
							<?loop controls?>
								<?if html ?>
									<?html?>
								<?else html ?>
									<a href="<?url?>"><?name?></a>
									<?if not:_last?> / <?endif not:_last?>
								<?endif html ?>
							<?endloop controls?>
						<?endif flags.can_edit ?>					</td>
				</tr>
			<?endloop services?>
		<?endloop categories?>


		<!-- Admin/Employee "Add Line Item" Contols. -->
		<? if ( $$variable{flags}{can_edit} && $$variable{is_staff} && !$$variable{is_quoted_or_ordered} ) ?>
			<form name="additem" method="post" action="/main/proj/dispatch.html">
				<tr class="control">
					<td><input name="item_name" size="20" class="smbox" /></td>
					<td><input name="price-1" size="9"  class="smbox" style="margin-left:40px" /></td>
					<td><?if qty.2?><input name="price-2" size="9"  class="smbox" /><?endif qty.2?></td>
					<td><?if qty.3?><input name="price-3" size="9"  class="smbox" /><?endif qty.3?></td>
					<td></td>
					<td><input type="hidden" name="pid" value="<?pid?>" />
							<input type="hidden" name="action" value="add_line_item" />
							<input type="submit" class="button" id="add-line-item" value="Add Line Item" />					</td>
				</tr>
			</form>
		<? endif ( $$variable{flags}{can_edit} && $$variable{is_staff} && !$$variable{is_quoted_or_ordered} ) ?>
	
		<!-- MATERIALS -->
		<tr class="title">
			<th colspan="6" style="border-width: 1px;">Materials</th>
		</tr>

		<? if ( $$variable{'ProjectTypeID'} ne 'ScreenItem' and not $$variable{checkout} ) ?>

			<?if ($$variable{flags}{stock_separate} && ! $$variable{flags}{hide_project_total}) ?>
				<!-- Stock pricing seperated from the form it belongs to (if the flag was set) -->
				<tr class="total">
					<th>Stock</th>
					<td><?if rfq_only?>-<?else rfq_only?><?endif rfq_only?></td>
					<td><?if qty.2?><?if rfq_only?>-<?else rfq_only?><?endif rfq_only?><?endif qty.2?></td>
					<td><?if qty.3?><?if rfq_only?>-<?else rfq_only?><?endif rfq_only?><?endif qty.3?></td>
				</tr>
			<?endif ($$variable{flags}{stock_separate} && ! $$variable{flags}{hide_project_total}) ?>
			
            <?if not:rfq_only?>
			<!-- Stock information. -->
			<?loop PaperInfo?>
				<tr>
                
					<td style="text-align: left; padding-left: 0em;"><?loop qty?>
						<?if n?><?if rfq_only?><?else rfq_only?><?n?><?if qty.2?>,<?endif qty.2?><?endif rfq_only?><?endif n?>
					<?endloop qty?>sheets -
                    <?height?>&#8243; &#215; <?width?>&#8243; - <?name?>, <?finish?>, <?colour?>, <?weight?> <?if ($variable->{is_supplied})?> [Customer Supplied]<?endif ($variable->{is_supplied})?></td>
					<td style="text-align:right"><?if paper_price1?><?if rfq_only?><?else rfq_only?><?money:paper_price1?><?else paper_price1?>$0.00<?endif rfq_only?><?endif paper_price1?></td>
					<td style="text-align:right"><?if q2?><?if paper_price2?><?if rfq_only?><?else rfq_only?><?money:paper_price2?><?else paper_price2?>$0.00<?endif rfq_only?><?endif paper_price2?><?endif q2?></td>
					<td style="text-align:right"><?if q3?><?if paper_price3?><?if rfq_only?><?else rfq_only?><?money:paper_price3?><?else paper_price3?>$0.00<?endif rfq_only?><?endif paper_price3?><?endif q3?></td>
					
				</tr>
			<?endloop PaperInfo?>
			 <?endif not:rfq_only?>
             
		<? endif ( $$variable{'ProjectTypeID'} ne 'ScreenItem' and not $$variable{checkout} ) ?>


		<!-- TOTALS -->
		<? if not:flags.hide_project_total ?>
			<tr class="total unit">
				<th>Project Unit Price:</th>
				<td><?if rfq_only?>-<?else rfq_only?><?money:unit_price.1?><?endif rfq_only?></td>
				<td><?if rfq_only?>-<?else rfq_only?><?money:unit_price.2?><?endif rfq_only?></td>
				<td><?if rfq_only?>-<?else rfq_only?><?money:unit_price.3?><?endif rfq_only?></td>
			</tr>
			<tr class="total grand">
				<th>Project Total:</th>
				<td><?if rfq_only?>RFQ Req<?else rfq_only?><?money:total_price.1?><?endif rfq_only?></td>
				<td><?if rfq_only?>-<?else rfq_only?><?money:total_price.2?><?endif rfq_only?></td>
				<td><?if rfq_only?>-<?else rfq_only?><?money:total_price.3?><?endif rfq_only?></td>
			</tr>
		<? endif not:flags.hide_project_total ?>
	</tbody>
</table>

<p class="memo">All prices in <?CurrencyName?> and subject to applicable taxes.</p>
