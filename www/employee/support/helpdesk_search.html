<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	<title>
		<!--#include virtual="/includes/web_page_title.html"-->
		Support - Help Desk Search
	</title>

	<!--#include virtual="/includes/web_page_meta.html" -->
	<!--#include virtual="/includes/h1-admin-css.html" -->

	<link href="/styles/forms.css" rel="stylesheet" type="text/css" />

	<!--#include virtual="/includes/h2-js.html" -->

	<script type="text/javascript" src="/javascripts/other.js"></script>
</head>

<body>

<!--#include virtual="/includes/c1-admin-nav.html" -->

<div id="content">

	<h1><span class="title-section">Managerial &#187;</span> Help Desk</h1>

	<fieldset>
		<legend>
			Search
		</legend>

		<p>Choose report criteria and click submit.</p>
	
		<form id="f1" name="f1" method="post">
			<label for="ddmCustomers">Customers:</label>
			<select id="ddmCustomers" name="ddmCustomers" size="1">
				<option value=""> All Customers </option>
				<?ddmCustomers?>
			</select>
			<br />

			<label for="ddmReviewed">Review Status:</label>
			<select id="ddmReviewed" name="ddmReviewed" size="1">
				<option value=""> All </option>
				<option value="Y" <?ddmReviewedY?>> Only Reviewed </option>
				<option value="N" <?ddmReviewedN?>> Only Non-Reviewed </option>
			</select>
			<br />

			<label for="ddmStartMonth">Start Date:</label>
			<select id="ddmStartMonth" name="ddmStartMonth">
				<?startmonths?>
			</select>
			<select id="ddmStartDay" name="ddmStartDay">
				<?startdays?>
			</select>
			<select id="ddmStartYear" name="ddmStartYear">
				<?startyears?>
			</select>
			<br />

			<label for="ddmEndMonth">End Date:</label>
			<select id="ddmEndMonth" name="ddmEndMonth">
				<?endmonths?>
			</select>
			<select id="ddmEndDay" name="ddmEndDay">
				<?enddays?>
			</select>
			<select id="ddmEndYear" name="ddmEndYear">
				<?endyears?>
			</select>
			<br />

			<!--#include virtual="/includes/reset-submit.html" -->
		</form>
		<br />
	</fieldset>

	<fieldset>
		<legend>
			Results
		</legend>
	
		<p class="none">&nbsp;</p>
	
		<? if ( @{$$variable{'HELPDESKENTRIES'}} ) ?>
			<table>
				<tr>
					<th>Submitter</th>
					<th>Date</th>
					<th>Company</th>
					<th>Reviewed?</th>
				</tr>

				<? while ( @$variable{'index','name','date','company', 'reviewed'} = splice @{$$variable{'HELPDESKENTRIES'}},0,5; ) ?>
					<tr>
						<td style="text-align: left;"><a href="helpdesk.html?helpdesk_id=<?index?>"><?name?></a></td>
						<td style="text-align: center;"><a href="helpdesk.html?helpdesk_id=<?index?>"><?date?></a></td>
						<td style="text-align: left;"><a href="helpdesk.html?helpdesk_id=<?index?>"><?company?></a></td>
						<td style="text-align: center;"><a href="helpdesk.html?helpdesk_id=<?index?>">
							<?if ( $$variable{'reviewed'} eq 'Y' ) ?>
								Yes
							<?else ( $$variable{'reviewed'} eq 'Y' ) ?>
								No
							<?endif ( $$variable{'reviewed'} eq 'Y' ) ?>
							</a>
						</td>
					</tr>
	
					<? if ( @$variable{'index','name','date','company', 'reviewed'} = splice @{$$variable{'HELPDESKENTRIES'}},0,5; ) ?>
						<tr class="colRow">
							<td style="text-align: left;"><a href="helpdesk.html?helpdesk_id=<?index?>"><?name?></a></td>
							<td style="text-align: center;"><a href="helpdesk.html?helpdesk_id=<?index?>"><?date?></a> </td>
							<td style="text-align: left;"><a href="helpdesk.html?helpdesk_id=<?index?>"><?company?></a> </td>
							<td style="text-align: center">
								<a href="helpdesk.html?helpdesk_id=<?index?>">
								<?if ( $$variable{'reviewed'} eq 'Y' ) ?>
									Yes
								<?else ( $$variable{'reviewed'} eq 'Y' ) ?>
									No
								<?endif ( $$variable{'reviewed'} eq 'Y' ) ?>
								</a>
							</td>
						</tr>
					<? endif ( @$variable{'index','name','date','company', 'reviewed'} = splice @{$$variable{'HELPDESKENTRIES'}},0,5; ) ?>
				<? endwhile ( @$variable{'index','name','date','company', 'reviewed'} = splice @{$$variable{'HELPDESKENTRIES'}},0,5; ) ?>
			</table>

		<? else ( @{$$variable{'HELPDESKENTRIES'}} ) ?>
			<p>There were no results.  Please try another query.</p>
		<? endif ( @{$$variable{'HELPDESKENTRIES'}} ) ?>
		<br />
	</fieldset>
</div>
<!--#include virtual="/includes/administrator/admin-footer.html" -->
</body>
</html>
