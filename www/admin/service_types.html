<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:tal="http://purl.org/petal/1.0/" xmlns:xi="http://www.w3.org/2001/XInclude">
	<head>
		<title tal:content="Test">Service Types</title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

		<xi:include href="/includes/petal-admin-css.html" />

		<link rel="stylesheet" href="/styles/admin/style.css" type="text/css" />

		<script type="text/javascript" src="/javascripts/admin/form.js"></script>

		<!-- TEMPORARY: Header menus. -->
		<script type="text/javascript" src="/javascripts/other.js"></script>
		<script type="text/javascript" src="/javascripts/menu.js"></script>
	</head>
	<body>
		<!-- TEMPORARY: Old header. -->
		<xi:include href="/includes/c1-tal.html" />
		<!-- Sidebar -->
		<div id="sidebar">
			<!-- Service Types. -->
			<div class="option">
				<!-- THIS SHOULD BE A LIST! Short on time right now and no CSS defined. -->
				<table class="no-formatting">
					<thead>
						<tr>
							<th>Service Types</th>
						</tr>
					</thead>
					<tbody>
						<tr tal:repeat="type types">
							<td tal:attributes="class decode:selected 1 'selected' nothing"><a href="service_types.html" tal:attributes="href string:service_types?type=$type/id" tal:content="type/name">Saddle Stitching</a></td>
						</tr>
						<tr tal:replace="nothing">
							<td><a href="service_types.html">Perfect Binding</a></td>
						</tr>
						<tr tal:replace="nothing">
							<td><a href="service_types.html">Double Loop Wire</a></td>
						</tr>
					</tbody>
				</table>
			</div>
			<!-- Audit log for the current page. -->
			<div class="option">
				<a class="back" href="/admin/audit_log.html" tal:attributes="href string:/admin/audit_log?page=${uri_escape: r/uri}&query=${uri_escape: r/args}">History</a>			</div>
		</div>
		<div id="content">
			<h1><span class="title-section">System &#187; Production &#187;</span> Service Types</h1>

			<form name="overs" method="POST" action="/admin/service_types?type=${r/param --type}">
                    <!-- General service_type information. -->
                    <fieldset><legend title="Name and other identifying details.">	Basic Information</legend>
                        <label><span>Name:</span><input name="name" type="text" value="Saddle Stiching" /></label>
                        <label><span>Description:</span><textarea name="description"></textarea></label>
                    </fieldset>
                    <!-- Overs -->
                    <fieldset><legend title="The default number of press sheets/unit to add to the initial print run if the chosen service type is run in the project.">	Default Wastage</legend>
                        <label title="The number of units needed to callibrate the machine"><span>Setup:</span><input class="numeric" name="overs_setup" type="text" value="0" /> Units</label>
                        <label title="The percentage of error while running a standard job."><span>Running Waste:</span><input class="numeric" name="overs_running" type="text" value="0" /> %</label>
                    </fieldset>
					<!--
                    <fieldset><legend title="Markup for multi page multi version projectss">Multi-page multi-version</legend>
                      <label title="The percentage to mark up the make ready cost"><span>Make ready mark up:</span><input class="numeric" name="mpmv_makerdy" type="text" value="0" /> %</label>
                    </fieldset>
	-->
				<div class="button-bar indent-regular">
                          <input name="save" type="submit" class="button" value="Save" />
                          <input name="reset" type="reset" class="button" value="Reset" />
                    </div>
			</form>
		</div>
	<xi:include href="/includes/f1-tal.html" />
	</body>
</html>
