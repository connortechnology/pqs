	<script  type="text/javascript">
		/* added this function on Nov.29, 2004 by Yang for Bug249.
		it checks the delivery date of an order,
		it's invalid if the delivery date is prior to the current date.*/

		function check_order_date(formName, projIndex) {
			/* get the selected delivery date from the drop down menu
			of the order marked by projIndex. */

			var form = getFormObj(formName);
			due_month = get_ddm_value(form.elements["ddmDueDateMonth"+projIndex]);
			due_year = get_ddm_value(form.elements["ddmDueDateYear"+projIndex]);
			due_day = get_ddm_value(form.elements["ddmDueDateDay"+projIndex]);

			/* get today's date */

			cur_date = new Date();
			cur_year = cur_date.getFullYear();
			cur_month = cur_date.getMonth() + 1;
			cur_day = cur_date.getDate();

			/* compare the selected delivery date with today's date.
			set the corresponding validityFlag marked by the same projIndex
			to false if the selected date is prior to today's date,
			otherwise set to true. */

			var short_months = ['04','06','09','11'];

			if ( (due_year < cur_year) ||
				(due_year == cur_year && due_month < cur_month ) ||
				(due_year == cur_year && due_month == cur_month && due_day < cur_day) ) {
				form.elements["validityFlag"+projIndex].value = "stale";
			} else if (
				(due_day == '31' && isin(short_months,due_month))
				|| (due_day >  '29' && due_month == '02')
				|| (due_day == '29' && due_month == '02') && (due_year % 4 != 0)
				) {

				form.elements["validityFlag"+projIndex].value = "invalid";
			}else {
				form.elements["validityFlag"+projIndex].value = "valid";
			} //	end if
		} //	end function

		/* changed this function on Nov.29, 2004 by Yang for Bug249.
		submit the form only if all orders delivery dates are valid. */

		function submit_handler(form) {

			// Add a quick check to make sure there's at least project in the order.
			if (!$A(form.elements).any(function (elem) { if (elem.name) return elem.name.match(/^rdbQuantity/) })) {
				alert('Please add at least one project to the order.');
				return false;
			}

			/* loop through all the validityFlag,
			set allValid to false if any of the flags is false. */

			allValid = true;

			for ( i=0; i < form.elements.length; i++) {
				if ( form.elements[i].type == "hidden" &&
					form.elements[i].name.substring(0,12) == "validityFlag" &&
					form.elements[i].value == "stale" ) {
					allValid = "stale";
				} else if ( form.elements[i].type == "hidden" &&
					form.elements[i].name.substring(0,12) == "validityFlag" &&
					form.elements[i].value == "invalid" ) {
					allValid = "invalid";
				}
			} //	end for

			/* alert user if not all dates are valid,
			otherwise submit the form. */

			if (allValid == "stale") {
				alert("The delivery date has already passed. Please choose a later date.");
			} else if (allValid == "invalid") {
				alert("This is not a valid date. Please correct the date and try again.");
			} else {
				return true;
			} //	end if
			return false;
		} //	end function
	</script>
