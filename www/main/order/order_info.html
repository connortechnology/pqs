	<script  type="text/javascript">
		function fill_user(form) {
			var name = form.ddmOrderForUsers.options[form.ddmOrderForUsers.selectedIndex].text.split(' ' );
			var email = form.ddmOrderForUsers.options[form.ddmOrderForUsers.selectedIndex].value;

			if ( name[0] == 'Select' ) {
				form.txtFirstName.value = '';
				form.txtLastName.value = '';
				form.txtEmail.value = '';
			} else {
				form.txtFirstName.value = name[0];
				form.txtLastName.value = name[1];
				form.txtEmail.value = email;
			} // end if
		} // end function
	</script>
</head>
