	function check_submit() {

			return true;
		<?else ( @{$variable->{projects}} ) ?> 
			alert("Please add a product to your Order before Submitting");
			return false;
		<?endif ( @{$variable->{projects}} ) ?> 

	}
	function set_ship_over(e) {
		var x = document.getElementById('shippingoverride');
		x.value = 1;

	}
	function reset_shipping(e) {
		var x = document.getElementById('shippingoverride');
		x.value = 0;

	}

	function need_shipping(e) {
		var x = document.getElementById('yesshipping');
		var edit = document.getElementById('shipedit');
		if (x.checked ) {
			edit.style.display="block"
		} else {
			edit.style.display="none"
		}
	}

	</script>
