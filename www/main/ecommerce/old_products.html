<script type="text/javascript">

function check_qty(f,inc,min,max) {
	var qty = f.value;
	var regExp = /^\d*$/;
	
//alert (inc + ' = ' + min + ',' + qty);

	if (!regExp.test(qty)) {
		alert('Invalid Entry. Please enter whole numbers only. Cannot contain Commas or Decimals.');
		return false;
	}

	var mod = qty % inc;
	if (( qty < min || qty > max || mod )&& qty > 0) {
		
//	if ( qty < min || qty > max ) {
		alert('Invalid Quantity. Please Order in increments of ' + inc + ' with a minimum order of ' + min + ' and a maximum quantity of ' + max + '.');
		return false;
	}
	return true;
}
</script>
