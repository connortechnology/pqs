<!--#include virtual="/includes/c1-main-nav.html" -->
	<h1><span class="title-section">Projects &#187;</span> <?service.category?> &#187; <?service.name?></h1>

	<form id="f1" name="f1" method="POST" action="/service/<?lc:service.ref?>">

		<!--#include virtual="/includes/main/proj/required_fields.html"-->

		<fieldset>
			<legend>Collating</legend>

			<p>The following signatures will be collated and slip sheeted.</p>
	
			<table class="no-center" style="margin-left: 3em;" summary="The number and type of signatures needing collation">
				<tr>
					<th>Quantity</th>
					<th>Signature Type</th>
					<th>Layout</th>
				</tr>
				<? loop pockets ?>
					<tr class="no-formatting">
						<td style="text-align: center"><?qty?></td>
						<td><?type?></td>
						<td><? if ($variable->{layout}) ?>
							<? if ($variable->{type} eq 'Interior Spreads')?>
							<?layout?>
							Page Signature
							<? else ($variable->{type} eq 'Interior Spreads')?>
							<?layout?>
							Gate Fold
							<? endif ($variable->{type} eq 'Interior Spreads')?>
							<? endif ($variable->{layout}) ?>
						</td>
					</tr>
				<? endloop pockets ?>
			</table>
		</fieldset>
