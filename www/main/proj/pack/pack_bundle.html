<head>
    <title>
        <!--#include virtual="/includes/web_page_title.html" -->
        Projects - <?service.category?> - <?service.name?>
        <!--#include virtual="/includes/web_page_title_end.html" -->
    </title>

    <!--#include virtual="/includes/web_page_meta.html" -->

    <link href="/styles/forms.css" rel="stylesheet" media="screen" />
	<link href="/styles/project_create.css" rel="stylesheet" type="text/css" />

    <!--#include virtual="/includes/h2-js.html" -->

	<script type="text/javascript" src="/javascripts/proj/service.js"></script>
	<script type="text/javascript">
			var service = new Service('<?service.ref?>');
	</script>
</head>
<body>
<!--#include virtual="/includes/c1-main-nav.html" -->
	<h1><span class="title-section">Projects &#187;</span> <?service.category?> &#187; <?service.name?></h1>

	<form action="/service/<?lc:service.ref?>" method="post" name="f1" id="f1">
		<!--#include virtual="/includes/main/proj/required_fields.html"-->
		<!--#include virtual="/includes/main/proj/dimensions_hidden.html"-->
	
		<fieldset>
			<legend>
				Bundles
			</legend>
		
			<p class="none">&nbsp;</p>
		
			<? if (($$variable{'BundleCross'} && $$variable{'BundlePaper'}) || ($$variable{'BundleElastic'} && $$variable{'BundlePaper'}) || ($$variable{'BundleCross'} && $$variable{'BundleElastic'})) ?>
		
				<p>What type of bundling do you require for your project?</p>
		
				<label>Bundling Type:</label>
				<div>
					<? if ($$variable{'BundleCross'}) ?>
						<label class="radio" for="rdbBundleTypeCrossBanding"><input type="radio" id="rdbBundleTypeCrossBanding" name="rdbBundleType" value="CrossBand" <?rdbBundleTypeCrossBand?> />Cross Banding</label><br />
					<? endif ($$variable{'BundleCross'}) ?>
		
					<? if ($$variable{'BundlePaper'}) ?>
						<label class="radio" for="rdbBundleTypePaperStrips"><input type="radio" id="rdbBundleTypePaperStrips" name="rdbBundleType" value="PaperStrip" <?rdbBundleTypePaperStrip?> />Paper Strips</label><br />
					<? endif ($$variable{'BundlePaper'}) ?>
		
					<? if ($$variable{'BundleElastic'}) ?>
						<label class="radio" for="rdbBundleTypeElasticBands"><input type="radio" id="rdbBundleTypeElasticBands" name="rdbBundleType" value="ElasticBand" <?rdbBundleTypeElasticBand?> />Elastic Bands</label><br />
					<? endif ($$variable{'BundleElastic'}) ?>
				</div>
				<br />
		
			<? else (($$variable{'BundleCross'} && $$variable{'BundlePaper'}) || ($$variable{'BundleElastic'} && $$variable{'BundlePaper'}) || ($$variable{'BundleCross'} && $$variable{'BundleElastic'})) ?>
		
				<? if ($$variable{'BundleCross'}) ?>
					<input type="hidden" id="rdbBundleType" name="rdbBundleType" value="CrossBand" />
				<? endif ($$variable{'BundleCross'}) ?>
		
				<? if ($$variable{'BundlePaper'}) ?>
					<input type="hidden" id="rdbBundleType" name="rdbBundleType" value="PaperStrip" />
				<? endif ($$variable{'BundlePaper'}) ?>
		
				<? if ($$variable{'BundleElastic'}) ?>
					<input type="hidden" id="rdbBundleType" name="rdbBundleType" value="ElasticBand" />
				<? endif ($$variable{'BundleElastic'}) ?>
		
			<? endif (($$variable{'BundleCross'} && $$variable{'BundlePaper'}) || ($$variable{'BundleElastic'} && $$variable{'BundlePaper'}) || ($$variable{'BundleCross'} && $$variable{'BundleElastic'})) ?>
		
		
			<p>How many items per bundle?</p>
		
			<label for="txtWrapQuantity">Items per Bundle:</label>
			<input id="txtWrapQuantity" name="txtWrapQuantity" value="<?txtWrapQuantity?>" type="text" size="9" class="smBox" />
			<br />
		
		
			<p>How many bundles are required?</p>
		
			<label for="txtQuantity">Bundles Required:</label>
			<input readonly="readonly" id="txtQuantity" name="txtQuantity" value="<?txtQuantity?>" type="text" size="9" class="smBox" />
			<br />
		</fieldset>
	
		<!--#include virtual="/includes/main/proj/quantities_prices.html"-->
		<!--#include virtual="/includes/main/proj/service_combo_quantity.html"-->
		<!--#include virtual="/includes/main/proj/add_to_project.html"-->
		<!--#include virtual="/includes/main/proj/hdn_fields_bindery.html"-->
	</form>
<!--#include virtual="/includes/f1-main.html" -->
<!--#include virtual="/includes/main/proj.html" -->
<!--#include virtual="/includes/f2-main.html" -->
</body>
</html>
