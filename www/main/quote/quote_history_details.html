<head>
	<title>

	<link href="/styles/quote.css" rel="stylesheet" type="text/css" />
	<link href="/styles/project.css" rel="stylesheet" type="text/css" />

	<!--#include virtual="/includes/h2-js.html" -->

	<script type="text/javascript" src="/javascripts/other.js"></script>

	<script  type="text/javascript">
		function delete_confirm(form) {
			if ( confirm("Are you sure you wish to delete this quote from history?\nClicking OK will take you back to the quote history page.") ) {
				form.submit();
			}
		}
	</script>

	<script  type="text/javascript">
		function open_printer_friendly_version() {
			window.open('/main/quote/quote_printer_friendly.html?quote_id=<?QUOTE_ID?>','printerfriendlyquote','newWin,left=140,width=680,top=50,height=400,resizable=yes,scrollbars=yes,menubar=yes,toolbar=yes,location=no,directories=yes,status=yes');
		}
	</script>

<body>
<!--#include virtual="/includes/c1-main-nav.html" -->
	<h1><span class="title-section">Quotes &#187;</span> Quote Details</h1>

	<p>Projects that have changed in price since the time this quote was originally generated will have to be recalculated before placing an order.</p>

	<div class="button-bar">
		<input type="button" class="button" onclick="open_printer_friendly_version();return false;" value="Printer Friendly" />

		<form name="f1" method="post" action="/main/quote/quote_history.html">
			<input type="hidden" name="btnFunction" value="Delete Quote" />
			<input type="hidden" name="quote_id" value="<?QUOTE_ID?>" />
			<input type="submit" name="delete_confirm(f1);return false;" class="button right" value="Delete" />
		</form>

		<form name="f2" method="post" action="/main/quote/quote_details.html">
			<input type="hidden" name="btnFunction" value="Process New Quote" />
			<input type="hidden" name="quote_id" value="<?QUOTE_ID?>" />
		</form>

		<? if ( ! $$variable{'InvalidPrices'} ) ?>
			<form name="f3" method="post" action="/main/order/order_selection.html">
				<input type="hidden" name="btnFunction" value="Process Order" />
				<input type="hidden" name="quote_id" value="<?QUOTE_ID?>" />
				<input type="submit" name="f3.submit();return false;" class="button right" value="Process Order" />
			</form>
		<? endif ( ! $$variable{'InvalidPrices'} ) ?>

		<form name="f4" method="post" action="/main/quote/quote_history_details.html">
			<input type="hidden" name="btnFunction" value="Send Quote" />
			<input type="hidden" name="quote_id" value="<?QUOTE_ID?>" />
			<input type="submit" name="f4.submit();return false;" class="button right" value="Send Quote" />
		</form>

		<br class="clear" />
		</div>
	
	<br class="clear" />

	<!--#include virtual="/includes/forms/quote.html"-->



	<div id="repcomment">
		<em>Representative:</em>

		<?AdministratorName?>

		<p>
			<em>Comments:</em>
			<?AdministratorComments?>
		</p>
	</div>

	<!-- Standard disclaimer -->
	<div id="disclaimer">
		<!--#include virtual="/includes/quote_disclaimer.html"-->
	</div>
