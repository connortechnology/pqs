<script language="javascript" type="text/javascript">
function submit_handler( form ) {
var text = '';
if ( ( ! form.txtAmount.value > 0 ) ) {
text += "Please enter a valid monetary amount.\n";
}
if ( ! form.ddmPaymentMethod.selectedIndex > 0 ) {
text += "Please select a payment method.\n";
}
if ( text ) {
alert( text );
} else {
form.submit();
} // end if
} // end function
</script>
</head>
