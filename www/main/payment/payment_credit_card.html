<span class="colTitle2">
Step 6: Submit Order

</span>

<form method="post" name="f1" action="/main/payment/payment_verification.html">
<table border="0" width="600" cellpadding="0" cellspacing="0">

<td width="150" height="20">

<td colspan="2" height="30">
<strong>
Credit Card Information:

</td>

<td colspan="2" height="15">&nbsp;
</td>

<tr>
<td height="30">
&nbsp;Credit Card Type:
</td>
<td height="30">
<select name="ddmCreditCardType" onchange="off(this.options[this.selectedIndex])" onfocus="on(this.options[this.selectedIndex]);on(this)" onblur="off(this.options[this.selectedIndex]);off(this)">
<option value="">
Select
</option>
<option value="Visa">
Visa
</option>
<option value="American Express">
American Express
</option>
</select>

</tr>
<tr>
<td height="30">
&nbsp;Expire Date:

</option>

<option value="">
Select
</option>
<?ddmExpiryYear?>
</select>
</td>
</tr>
<tr>
<td height="30">
&nbsp;Card Holder:
</td>
<td height="30">
<input type="text" name="txtCardHolder" size="30"  class="input-text" onfocus="on(this)" onblur="off(this)">
</td>
</tr>
<tr>
<td colspan="2" height="15">&nbsp;
</td>
</tr>
</table>
