<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
    <title><!--#include virtual="/includes/web_page_title.html" -->Account - User Profile<!--#include virtual="/includes/web_page_title_end.html" --></title>

    <!--#include virtual="/includes/web_page_meta.html" -->
    <!--#include virtual="/includes/h1-main-css.html" -->

	<link href="/styles/forms.css" rel="stylesheet" media="screen" />

    <!--#include virtual="/includes/h2-js.html" -->

    <script type="text/javascript" src="/javascripts/other.js"></script>
    <script type="text/javascript">
	window.onunload = function() {
    if (window.opener && !window.opener.closed) {
        window.opener.popUpClosed();
    }
};
</script>
</head>

<body>
<!--#include virtual="/includes/c1-main-nav.html" -->

	<h1><span class="title-section">Account &#187;</span> User Profile</h1>

	<? if ( $$variable{'user_id'} ) ?>

		<form id="user_profile" method="post" action="user_profile.html" onsubmit="return fmCheck(f1);" name="f1">

			<? if ( $$variable{'isAdmin'} eq 'Y' ) ?>
				<fieldset>
					<legend>
						User Selection
					</legend>
	
					<p>To edit <strong>user</strong> profile(s), complete the form below. To edit the profile of your <strong>company</strong>, click <a href="/main/account/account_edit_company_profile.html"><strong>here</strong></a>.</p><br />
	
					<label for="ddmUser">Select User:</label>
					<select id="ddmUser" name="ddmUser" onchange="if(this.options[this.selectedIndex].value != '') f1.submit();">
						<option value="">- Please select one. -</option>
						<?FILL_USER_NAME?>
					</select>
					<br />

					<div class="button-bar indent-regular ie-button-bar">
						<input class="button" type="submit" name="btnFunction" value="&lt;&lt;" />
						<input class="button" type="submit" name="btnFunction" value="&gt;&gt;" />
						<input class="button" type="button" name="btnFunction" value="New" onclick="addCheck(f1);" />
						<input class="button" type="submit" name="btnFunction" value="Delete" onclick="fmChange=2;" />
	
						<input class="button" type="reset" />
						<input class="button" type="submit" name="btnFunction" value="Save" onclick="fmChange=3;" />
						<br />
					</div>
	
					<br />
				</fieldset>
			<? endif ( $$variable{'isAdmin'} eq 'Y' ) ?>

			<fieldset>
				<legend>
					User Information
				</legend>

				<p class="none">&nbsp;</p>

				<span class="label"><span class="required">*</span>Salutation:</span>

				<label for="rdbSalutationMr" class="radio"><input type="radio" id="rdbSalutationMr" name="rdbSalutation" value="Mr." <?rdbSalutationMr.?> />Mr.</label>

				<label for="rdbSalutationMrs" class="radio"><input type="radio" id="rdbSalutationMrs" name="rdbSalutation" value="Mrs." <?rdbSalutationMrs.?> />Mrs.</label>

				<label for="rdbSalutationMs" class="radio"><input type="radio" id="rdbSalutationMs" name="rdbSalutation" value="Ms." <?rdbSalutationMs.?> />Ms.</label>

				<label for="rdbSalutationMiss" class="radio"><input type="radio" id="rdbSalutationMiss" name="rdbSalutation" value="Miss" <?rdbSalutationMiss?> />Miss</label>

				<br />

				<label for="txtFirstName"><span class="required">*</span>First Name:</label>
				<input type="text" id="txtFirstName" name="txtFirstName" value="<?txtFirstName?>" class="input-text" />
				<br />

				<label for="txtLastName"><span class="required">*</span>Last Name:</label>
				<input type="text" id="txtLastName" name="txtLastName" value="<?txtLastName?>" class="input-text" />
				<br />

				<label for="txtTitle">Position:</label>
				<input type="text" id="txtTitle" name="txtTitle" value="<?txtTitle?>" class="input-text" />
				<br />

				<label for="txtPhone"><span class="required">*</span>Phone:</label>
				<input type="text" id="txtPhone" name="txtPhone" value="<?txtPhone?>" class="input-text" />
				<br />

				<label for="txtExtension">Extension:</label>
				<input type="text" id="txtExtension" name="txtExtension" value="<?txtExtension?>" class="input-text" maxlength="4" />
				<br />

				<label for="txtFax">Fax:</label>
				<input type="text" id="txtFax" name="txtFax" value="<?txtFax?>" class="input-text" />
				<br />
				
				<label>Add to our Mailing List:</label>

				<label for="rdbMailingListYes" class="radio"><input type="radio" id="rdbMailingListYes" name="rdbMailingList" <?rdbMailingListY?> value="Y"	onchange="fmChange=1" />Yes</label>

				<label for="rdbMailingListNo" class="radio"><input type="radio" id="rdbMailingListNo" name="rdbMailingList" <?rdbMailingListN?> value="N"	onchange="fmChange=1" />No</label>

				<br />

				<? if ( $$variable{'isAdmin'} eq 'Y' ) ?>

					<label>Is this account active?</label>

					<label for="rdbAccountActivationYes" class="radio"><input type="radio" id="rdbAccountActivationYes" name="rdbAccountActivation" <?rdbAccountActivationY?> value="Y"	onchange="fmChange=1" />Yes</label>

					<label for="rdbAccountActivationNo" class="radio"><input type="radio" id="rdbAccountActivationNo" name="rdbAccountActivation" <?rdbAccountActivationN?> value="N"	onchange="fmChange=1" />No</label>

					<br />

					<label>Is this account a company administrator?</label>

					<label for="rdbAdministratorYes" class="radio"><input type="radio" id="rdbAdministratorYes" name="rdbAdministrator" <?rdbAdministratorY?> value="Y" onchange="fmChange=1;" />Yes</label>

					<label for="rdbAdministratorNo" class="radio"><input type="radio" id="rdbAdministratorNo" name="rdbAdministrator" <?rdbAdministratorN?> value="N" onchange="fmChange=1;" />No</label>

					<br />

				<? endif ( $$variable{'isAdmin'} eq 'Y' ) ?>

				<p>The following information will be used for future logins.</p>

				<label for="txtEmail"><span class="required">*</span>E-mail Address:</label>
				<input type="text" id="txtEmail" name="txtEmail" value="<?txtEmail?>" size="30" class="input-text" />
				<br />

				<label for="txtPassword"><span class="required">*</span>Password:</label>
				<input type="password" id="txtPassword" name="txtPassword" value="<?txtPassword?>" size="30" class="input-text" />
				<br />

				<label for="txtVerifyPassword"><span class="required">*</span>Verify Password:</label>
				<input type="password" id="txtVerifyPassword" name="txtVerifyPassword" value="<?txtPassword?>" size="30" class="input-text" />
				<br />

				<div class="button-bar indent-regular">
					<input class="button" type="reset" />
					<input class="button" type="submit" name="btnFunction" value="Save" onclick="fmChange=3;" />
					<br />
				</div>

				<br />
			</fieldset>

			<input type="hidden" name="btnFunction" />
		</form>

	<? else ( $$variable{'user_id'} ) ?>
		<p>You must be logged in to edit user profiles.</p>	
	<? endif ( $$variable{'user_id'} ) ?>

<!--#include virtual="/includes/f1-main.html" -->
<!--#include virtual="/includes/main/account.html" -->
<!--#include virtual="/includes/f2-main.html" -->
</body>
</html>
