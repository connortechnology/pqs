<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>

<body onload="document.getElementById('txtEmail').focus();">
<!--#include virtual="/includes/c1-main-nav.html" -->

  <h1><span class="title-section">Account &#187;</span> Login</h1>
  <form id= "account_confirmation_login" method="post" action="/main/account/confirmation_login.html" name="f1">
    <fieldset>
      <legend> Login </legend>
  
      <p>Please enter your e-mail address and password to login.</p>
  
      <label for="txtEmail">E-mail:</label>
      <input type="text" id="txtEmail" name="txtEmail" class="input-text" autocomplete="username"/>
      <br />
  
      <label for="txtPassword">Password:</label>
      <input type="password" id="txtPassword" name="txtPassword" class="input-text" autocomplete="current-password"/>
      <br />
  
      <!--#include virtual="/includes/reset-submit.html" -->
  
      <br />
    </fieldset>

    <input type="hidden" name="Destination" value="<?Destination?>" />
  </form>
  
  <form id="account_confirmation_password" method="post" action="/main/account/confirmation_password_0.html" name="f2">
		<fieldset>
			<legend>
				Password Retrieval
			</legend>
	
			<p class="none">&nbsp;</p>
	
			<h2>Forget your Password?</h2>
	
			<p>To have your password e-mailed to you, please submit your e-mail address below.</p>
	
			<br />
	
			<label for="txtEmail2">E-mail:</label>
			<input type="text" id="txtEmail2" name="txtEmail2" class="input-text" />
			<br />
	
			<input type="hidden" name="btnSendCustomerPassword" />
	
			<label></label>
      <button type="submit" class="g-recaptcha" data-sitekey="6LdWLJkqAAAAAKTanTPJMbwpMx4752S1rOpZRGKX" data-callback="onSubmit" data-action="submit">Submit</button>
			<br />
		</fieldset>
	</form>

<!--#include virtual="/includes/f1-main.html" -->
<!--#include virtual="/includes/main/account.html" -->
<!--#include virtual="/includes/f2-main.html" -->
 <script>
   function onSubmit(token) {
	   const form = document.getElementById("account_confirmation_password");
	   if (form.elements['txtEmail2'].value) {
		   form.submit();
	   } else {
		   alert("Please enter your email address!");
		   document.getElementById('txtEmail2').focus();
	   }
   }
 </script>
	 <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>
</html>
