<body>
<!--#include virtual="/includes/c1-main-nav.html" -->

	<h1><span class="title-section">Account &#187;</span> Password</h1>

	<form id="account_password" method="post" action="/main/account/confirmation_password_1.html" name="f1">

		<fieldset>
			<legend>
				Password Change
			</legend>
			
			<p><?message?></p>

			<label for="txtOldPassword">Old Password:</label>
			<input type="password" id="txtOldPassword" name="txtOldPassword" class="input-text" />
			<br />

			<label for="txtNewPassword">New Password:</label>
			<input type="password" id="txtNewPassword" name="txtNewPassword" class="input-text" />
			<br />

			<label for="txtConfirmPassword">Confirm Password:</label>
			<input type="password" id="txtConfirmPassword" name="txtConfirmPassword" class="input-text" />
			<br />

			<input type="hidden" name="btnCustomerLogin" />

			 <div class="button-bar indent-regular">
				<input class="button" type="reset" />
				<input class="button" type="submit" name="btnCustomerLogin" value="Submit" />
				<br />
			</div>
			
			<br />
		</fieldset>
	</form>
